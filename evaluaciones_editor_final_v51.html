#calc{position:fixed;right:12px;bottom:12px;width:244px;max-width:calc(100vw - 16px);z-index:90;background:#fff;border:2px solid var(--bd);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.3);overflow:hidden;user-select:none;-webkit-user-select:none}
#calc .ch0{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 12px;background:#0b5a1c;color:#fff;font-weight:800;font-size:13px;cursor:grab;touch-action:none}
#calc .ch0 button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;width:28px;height:26px;font-weight:800;cursor:pointer}
#calc .cd0{padding:8px 12px 2px;text-align:right;min-height:58px}
#calc .ce{font-size:12px;color:#6b7a73;min-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#calc .cr{font-size:28px;font-weight:800;color:#1f2937;overflow:hidden;white-space:nowrap}
#calc .ck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
#calc .ck button{border:0;border-radius:10px;min-height:42px;font-size:18px;font-weight:700;background:#f1f6f2;color:#1f2937;cursor:pointer;font-family:inherit}
#calc .ck button:active{filter:brightness(.92)}
#calc .ck .o{background:#dcfce7;color:#14532d}#calc .ck .e{background:#0b5a1c;color:#fff}#calc .ck .c{background:#ffe4ea;color:#9f1239}
#calc .cp{margin:0 8px 8px;width:calc(100% - 16px);border:2px solid var(--bd);background:#fff;border-radius:10px;padding:8px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}

.calt td.ca{position:relative}
.box .calt td.ca input.gp:not([type=file]){padding-right:36px!important}
.calbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:8px;background:#e8f5ec;cursor:pointer;font-size:15px;line-height:1;padding:0}
.calbtn:active{filter:brightness(.92)}.fin .calbtn{display:none}
.calon{outline:3px solid #0b5a1c!important;outline-offset:-3px}
#calc .ck .p{background:#e0f2fe;color:#075985}
#calc .cp{border:0;background:#0b5a1c;color:#fff;margin:0 8px 8px;width:calc(100% - 16px);min-height:42px;border-radius:10px;font-size:13px;white-space:nowrap;padding:0 6px;font-weight:800;font-family:inherit;cursor:pointer}
#calc .cp:active{filter:brightness(.92)}
.calbtn{display:flex;align-items:center;justify-content:center;color:#166534}
/* --- datos del alumno + imagen --- */
.idb .ig{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.idb label{display:block;font-weight:700;font-size:12px;color:var(--mu)}
.idb input.er{border-color:var(--no)!important;background:#fff1f3}
.idb input:disabled,.idb input[readonly]{opacity:1;color:var(--tx);-webkit-text-fill-color:var(--tx);background:#f6faf7}
.idb .idv{font-weight:800;font-size:16px;color:var(--tx);padding:3px 0;border-bottom:2px solid var(--bd);min-height:28px}
.idb small{display:block;font-weight:700}
@media(max-width:560px){.idb .ig{grid-template-columns:1fr}}
#sc{scroll-margin-top:60px}
.terf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 8px;text-align:left}.terf label{font-size:12px;font-weight:700;color:var(--mu);display:block}.terf input:not([type=color]){margin-top:3px!important}.terp{padding:6px 0;text-align:center}

/* ===== casilleros por llenar (señal para el alumno) ===== */
@keyframes pendp{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 0 4px rgba(245,158,11,.35)}}
.box.q:not(.fin) input.gp.pend,.box.q:not(.fin) select.gp.pend,.box.q:not(.fin) input.cdv.pend{background:#fffbe6!important;border:2px dashed #f59e0b!important;border-radius:8px!important;animation:pendp 1.8s ease-in-out infinite}
.box.q:not(.fin) .hole.pend{background:#fffbe6;border:2px dashed #f59e0b;animation:pendp 1.8s ease-in-out infinite}
.box.q:not(.fin) input.gp.pend::placeholder{color:#d97706;opacity:.8;font-weight:800}
.pendn{align-self:center;font-weight:800;font-size:13px;color:#b45309;background:#fffbe6;border:2px dashed #f59e0b;border-radius:20px;padding:5px 12px}
.pendn:empty{display:none}
/* ===== ENCABEZADO CONFIGURABLE ===== */
.eh{position:relative;overflow:hidden;container-type:inline-size;background:#fff;border:2px solid var(--dc,#16335f);border-radius:14px;padding:8px 10px;margin:6px 0 10px}
.eh.cor{padding:20px 10px 18px}
.eh.plain{background:none;border:0;border-radius:0;padding:0;overflow:visible;margin:6px 0 0}
.eh.cor::before,.eh.cor::after{content:"";position:absolute;width:84px;height:16px;background:var(--dc);pointer-events:none}
.eh.cor::before{top:0;left:0;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.eh.cor::after{bottom:0;right:0;clip-path:polygon(16px 0,100% 0,100% 100%,0 100%)}
.eh-ht{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.eh-m{display:flex;gap:10px;align-items:stretch}
.eh-l{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center;align-self:stretch}.eh-li{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.eh-i-lg{flex:none}.eh-i-ch{flex:1 1 0;min-height:0;display:flex}.eh-im.eh-i-ch img{flex:1;min-width:0;min-height:0;width:100%;height:100%;object-fit:contain}
.eh-im.eh-i-ch .eh-imu{flex:1;min-height:0}.eh-l .eh-b{margin:0}
.eh-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:flex-start}
.eh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.eh-k{min-width:0}
.eh-k{font-weight:800;letter-spacing:.5px;text-transform:uppercase;white-space:pre-line}

/* ===== BANNER DE FAMILIA (degradado + destello + detalle luxury) ===== */
.eh-bn{position:relative;overflow:hidden;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;color:#fff;border-radius:14px;padding:9px 16px 8px;margin:2px 0;
 background:linear-gradient(115deg,var(--b0) 0%,var(--b1) 52%,var(--b2) 100%);
 box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 20px rgba(0,0,0,.14)}
.eh-bn::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 88% -25%,rgba(255,255,255,.32),transparent 58%),linear-gradient(180deg,rgba(255,255,255,.16),transparent 46%)}
.eh-bn.shn::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-45%;width:26%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-22deg);animation:bnSh 4s ease-in-out infinite}
@keyframes bnSh{0%,50%{left:-45%}100%{left:135%}}
.bn-t{position:relative;z-index:1;max-width:100%;font-weight:800;font-size:var(--bz,22px);line-height:1.15;letter-spacing:.4px;text-transform:uppercase;white-space:pre-line;overflow-wrap:anywhere;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.bn-s{position:relative;z-index:1;max-width:100%;font-weight:600;font-style:italic;font-size:var(--bs,10px);line-height:1.2;opacity:.92;white-space:pre-line}
.eh-bn.lux{margin:3px;border:3px solid transparent;border-radius:14px;padding:6px 18px 5px;
 background:linear-gradient(115deg,var(--b0) 0%,var(--b1) 52%,var(--b2) 100%) padding-box,linear-gradient(135deg,#fff4c6 0%,#e8c65e 16%,#9b7018 36%,#f9e9a4 54%,#c99a2e 74%,#fff1b4 100%) border-box;
 box-shadow:0 0 0 1px rgba(110,78,12,.6),0 8px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 20px rgba(0,0,0,.16)}
.eh-bn.lux .bn-t{text-shadow:0 2px 3px rgba(0,0,0,.4),0 0 12px rgba(255,226,140,.35)}
.bn-fr{position:absolute;inset:3px;border:1px solid rgba(246,222,140,.7);border-radius:9px;pointer-events:none;z-index:1}
.bn-d{position:absolute;width:16px;height:16px;z-index:2;pointer-events:none;border:0 solid #f6dc86;filter:drop-shadow(0 0 1px rgba(90,60,5,.8))}
.bn-d.a{top:3px;left:3px;border-top-width:2px;border-left-width:2px;border-top-left-radius:9px}
.bn-d.b{top:3px;right:3px;border-top-width:2px;border-right-width:2px;border-top-right-radius:9px}
.bn-d.c{bottom:3px;left:3px;border-bottom-width:2px;border-left-width:2px;border-bottom-left-radius:9px}
.bn-d.d{bottom:3px;right:3px;border-bottom-width:2px;border-right-width:2px;border-bottom-right-radius:9px}
.eh-bn [contenteditable]{outline:none;cursor:text;min-width:1ch}
.eh-bn [contenteditable]:empty::before{content:attr(data-ph);opacity:.7}
.eh-bn [contenteditable]:hover{box-shadow:0 0 0 2px rgba(255,255,255,.55)}.eh-bn [contenteditable]:focus{box-shadow:0 0 0 2px #fff}
.fri>.eh-bn{height:100%;margin:0;border-radius:calc(12*var(--u));padding:0 calc(12*var(--u))}
.eh.fr .eh-bn .bn-s{font-size:max(var(--bs),10px)}
.eh.fr .eh-bn .bn-t{font-size:var(--bz)!important}
@container (max-width:520px){.eh-bn .bn-t{font-size:calc(var(--bz,22px)*.8)}}
@media (prefers-reduced-motion:reduce){.eh-bn.shn::after{animation:none;display:none}}
.eh-tw{display:flex}.eh.plain .eh-tw{margin:6px 0 12px}
.eh-t{display:inline-block;max-width:100%;font-weight:800;line-height:1.15;font-size:var(--tsz,26px);white-space:pre-line;overflow-wrap:anywhere;margin:0}
.eh-t.sh-pill{padding:4px 16px;border-radius:30px}.eh-t.sh-rect{padding:4px 12px;border-radius:8px}.eh-t.sh-none{padding:0}
.eh-ph{font-weight:400;white-space:pre-line}
.eh-im{max-width:24cqw}.eh-im img{display:block;width:100%;height:auto}
.eh-b{display:flex;align-items:center;gap:6px;margin-left:auto}
.eh-bt{background:var(--bc);color:var(--bt);border-radius:20px;padding:3px 12px;font-weight:800;font-size:12px;text-align:center;white-space:nowrap}
.eh-live{border:2px solid var(--bc);color:var(--bc);background:#fff;border-radius:20px;padding:0 8px;font-weight:800;font-size:10px;letter-spacing:1px;white-space:nowrap}
.eh-nota{align-self:flex-start;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:118px;color:var(--dc)}
.eh-nl{font-weight:800;font-size:12px;letter-spacing:.5px;text-align:left;line-height:1.1}
.eh-nv{display:flex;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:3px 8px;border:3px solid var(--dc);border-radius:12px;background:#fff;font-size:40px;font-weight:800;line-height:1}
.eh{scroll-margin-top:60px}
.nrs{margin:4px 0 0!important;font-size:12px;font-weight:700;text-align:center;color:var(--mu);line-height:1.2}
.dlw{margin-top:5px}.dlw .bt{width:100%;padding:7px 6px;font-size:12px;white-space:nowrap}
.eh-nv small{font-size:15px;font-weight:700;color:var(--mu)}
.nhd .big,.nhd .nl{display:none}
.eh-ln{border-top:3px dotted var(--dc);margin-top:10px}
.eh .idb{margin:0}
.eh .idb .ig{display:flex;gap:4px 14px;grid-template-columns:none}
.eh .idb .ig.lc{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 10px;align-items:end}
.eh .idb .ig.lc .hf{display:contents}.eh .idb .ig.lc .hfl{padding-bottom:5px}
.eh .idb .ig.lr{flex-direction:row;flex-wrap:wrap}
.eh .idb .ig.lr .hf{flex:1 1 130px;flex-direction:column;align-items:stretch;gap:2px}.eh .idb .ig.lr .hf.nm{flex:1 1 100%}
.eh .idb .ig.lp{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
.eh .idb .ig.lp .hf.nm{grid-column:1/-1}
.eh .idb .hf{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--dc);margin:0}
.eh .idb .hfl{flex:none;white-space:nowrap}
.eh .idb .hf input:not([type=file]),.eh .idb .hfv{flex:1;min-width:0;width:100%;margin:0;border:0;border-bottom:2px solid var(--dc);border-radius:0;background:transparent;padding:3px 6px;font-weight:700;color:var(--tx);min-height:26px}
.eh .idb .idv{flex:1;min-width:0}
.eh.plain .idb .hf{color:var(--mu);font-size:12px}
.eh.plain .idb .hf input:not([type=file]){border:2px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff}
.eh.plain .idb .ig.lc{align-items:center}.eh.plain .idb .ig.lc .hfl{padding-bottom:0}
@container (max-width:520px){.eh-i-ch{display:block;flex:none}.eh-im.eh-i-ch img{height:auto}.eh-m{flex-wrap:wrap}.eh-c{order:1;flex:1 1 100%}.eh-l{flex:1}.eh-t{font-size:calc(var(--tsz,26px)*.8)}.eh .idb .ig.lp{grid-template-columns:1fr}}
.eh [contenteditable]{outline:none;cursor:text;min-width:1ch}
.eh [contenteditable]:hover{box-shadow:0 0 0 2px rgba(43,100,184,.35)}.eh [contenteditable]:focus{box-shadow:0 0 0 2px #2b64b8}
.eh [contenteditable]:empty::before{content:attr(data-ph);opacity:.7}
.eh-imu{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:2px dashed #94a3b8;border-radius:12px;color:var(--mu);font-size:11px;font-weight:700;background:#f8fafc;text-align:center;overflow:hidden;padding:2px}
.eh-imu.has{border:0;background:none;min-height:0;padding:0}.eh-imu img{display:block;width:100%;height:auto}
.eh-g{border:2px dashed #94a3b8;border-radius:10px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--mu);opacity:.75;text-align:center;background:#f8fafc}
.hdE{background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.hdE .eh{max-width:none;margin-left:0;margin-right:0}
.hdE .eh [data-hp]{cursor:pointer}
.hdE .eh [data-hp]:hover{outline:2px dashed rgba(43,100,184,.5);outline-offset:3px}
.hdE .eh [data-hp].hpa{outline:2px solid #2b64b8;outline-offset:3px}
.hdE .eh.hpa{box-shadow:0 0 0 3px rgba(43,100,184,.45)}
.hdh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.hdp{position:fixed;z-index:90;width:min(330px,94vw);max-height:70vh;overflow:auto;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hdp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.hdb{padding:6px 12px;font-size:13px}
.hgc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:13px;font-weight:600}.hgc>span{min-width:96px;color:var(--mu)}
.hgc input[type=range]{flex:1;min-width:110px}.hgc output{min-width:26px;font-weight:800}
.hgk{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:13px;font-weight:600;cursor:pointer}
.hgch{display:flex;gap:6px;flex-wrap:wrap}.hgch .ch{padding:4px 11px;font-size:12px}

/* ===== ENCABEZADO LIBRE (mover / estirar / agrandar) ===== */
.eh.fr{--u:calc(100cqw/680);width:100%;padding:0!important;overflow:visible}
.eh.fr .fri{position:absolute;display:flex;box-sizing:border-box;min-width:0}
.fri>.eh-k,.fri>.eh-ph{width:100%;height:100%;display:flex;align-items:center}
.fri>.eh-tw{width:100%;height:100%;margin:0}
.eh.fr .eh-tw .eh-t{display:flex;align-items:center;justify-content:center;width:100%;height:100%;box-sizing:border-box;padding:0 calc(12*var(--u));font-size:var(--tsz)!important;border-radius:calc(30*var(--u))}
.fri>.eh-b{width:100%;height:100%;margin:0;justify-content:center}
.fri>.eh-b .eh-bt{flex:1;height:100%;display:flex;align-items:center;justify-content:center;padding:0 calc(10*var(--u));font-size:calc(12*var(--fs)*var(--u))}
.fri>.eh-b .eh-live{font-size:calc(10*var(--fs)*var(--u));padding:0 calc(8*var(--u))}
.fri>.eh-im{width:100%!important;height:100%;max-width:none;display:flex}
.fri>.eh-im .eh-imu{width:100%;height:100%;min-height:0}
.fri>.eh-im img{width:100%;height:100%;object-fit:contain}
.fri>.eh-g{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.fri>.idb{width:100%;height:100%;margin:0}
.eh.fr .idb .hf{font-size:calc(12*var(--fs)*var(--u))}
.eh.fr .idb .hf input:not([type=file]),.eh.fr .idb .hfv{min-height:0;padding:calc(2*var(--u)) calc(4*var(--u))}
.eh.fr .idb .idv{font-size:inherit;font-weight:800}
.eh.fr .idb .ig.lp{grid-template-columns:1fr 1fr}
.fri>.eh-nota{width:100%;height:100%;min-width:0;align-self:stretch}
.fri>.eh-nota .nrs{font-size:calc(12*var(--fs)*var(--u))!important;margin:calc(4*var(--u)) 0 0!important}
.fri>.eh-nota .dlw{margin-top:calc(5*var(--u))}
.fri>.eh-nota .dlw .bt{font-size:calc(12*var(--fs)*var(--u));padding:calc(6*var(--u)) calc(6*var(--u))}
.fri>.eh-nota .eh-nl{font-size:calc(12*var(--fs)*var(--u))}
.fri>.eh-nota .eh-nv{flex:1;min-height:calc(46*var(--fs)*var(--u));font-size:calc(40*var(--fs)*var(--u));border-width:calc(3*var(--u));border-radius:calc(12*var(--u));padding:0 calc(8*var(--u))}
.fri>.eh-nota .eh-nv small{font-size:calc(15*var(--fs)*var(--u))}
.eh.fr .eh-ln{position:absolute;left:3%;right:3%;bottom:calc(6*var(--u));margin:0}
.fri .frh{display:none;position:absolute;z-index:8;touch-action:none;box-sizing:border-box}
.hdE .fri:hover>.frg,.fri.sel>.frg{display:grid}
.fri.sel>.frz{display:block}
.fri.sel{outline:2px solid #2b64b8;outline-offset:2px}
.frg{left:0;top:-24px;width:26px;height:22px;background:#2b64b8;color:#fff;border-radius:7px 7px 0 0;place-items:center;font-size:14px;line-height:1;cursor:move;user-select:none;-webkit-user-select:none}
.frz{background:#fff;border:2px solid #2b64b8}
.frz.n,.frz.s{left:calc(50% - 14px);width:28px;height:10px;border-radius:5px;cursor:ns-resize}
.frz.n{top:-6px}.frz.s{bottom:-6px}
.frz.e,.frz.w{top:calc(50% - 14px);width:10px;height:28px;border-radius:5px;cursor:ew-resize}
.frz.e{right:-6px}.frz.w{left:-6px}
.frz.ne,.frz.nw,.frz.se,.frz.sw{width:14px;height:14px;border-radius:50%;background:#2b64b8;border-color:#fff}
.frz.nw{left:-8px;top:-8px;cursor:nwse-resize}.frz.se{right:-8px;bottom:-8px;cursor:nwse-resize}
.frz.ne{right:-8px;top:-8px;cursor:nesw-resize}.frz.sw{left:-8px;bottom:-8px;cursor:nesw-resize}
#hdv .eh.fr .fri{cursor:move}
#hdv .eh.fr .fri [contenteditable]:focus{cursor:text}
#hdv .eh-ref{opacity:.4;pointer-events:none;user-select:none;-webkit-user-select:none}
#hdv .dlw .bt{display:block;text-align:center}
#hdfr.on{background:#2b64b8;color:#fff;border-color:#2b64b8}
/* ===== BANNER A RAS (cubre arriba y a los lados del encabezado) + encabezado más alto ===== */
.eh.hb .fri[data-fk="t"]{left:0!important;top:0!important;width:100%!important}
.eh.hb .fri[data-fk="t"]>.eh-bn{margin:0;border-radius:8px 8px 0 0}
.eh.hb:not(.fr){padding-top:0;padding-left:0;padding-right:0}
.eh.hb:not(.fr) .eh-ht{margin:0 0 12px}
.eh.hb:not(.fr) .eh-bn{margin:0;border-radius:8px 8px 0 0;padding:14px 16px 12px}
.eh.hb:not(.fr) .eh-bn.lux{padding:11px 18px 10px}
.eh.hb:not(.fr) .eh-m{padding:0 10px}
.eh.hb:not(.fr) .eh-c .eh-ph{margin-top:16px}
/* sin sombra en el banner, sin marco en la nota, datos del alumno más abajo */
.eh.hb .eh-bn,.eh.hb .eh-bn.lux{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 20px rgba(0,0,0,.14)}
.eh .eh-nv,.fri>.eh-nota .eh-nv{border:0!important;background:#fbf0d4}
.eh .idb .hf.nm{margin-top:10px}
.eh.hb:not(.fr) .idb{margin-top:12px}
/* Columna izquierda en flujo normal: logo arriba, imagen del nivel debajo e insignia al final; nada se superpone (PC y celular) */

let CALA='',CALR='0',CALD=false,CALT=null;
function calcEval(x){const t=x.replace(/\s/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/().%]+$/.test(t))throw 0;let p=0;
 const num=()=>{if(t[p]==='('){p++;const r=add();if(t[p]!==')')throw 0;p++;return {v:r.pct?r.v/100:r.v,pct:false}}if(t[p]==='-'){p++;const r=num();return {v:-r.v,pct:r.pct}}if(t[p]==='+'){p++;return num()}const m=/^\d*\.?\d+|^\d+\.?/.exec(t.slice(p));if(!m)throw 0;p+=m[0].length;let pct=false;if(t[p]==='%'){p++;pct=true}return {v:parseFloat(m[0]),pct}},
 mul=()=>{const a=num();if(t[p]!=='*'&&t[p]!=='/')return a;let v=a.pct?a.v/100:a.v;while(t[p]==='*'||t[p]==='/'){const o=t[p++],r=num(),rv=r.pct?r.v/100:r.v;if(o==='/'&&rv===0)throw 0;v=o==='*'?v*rv:v/rv}return {v,pct:false}},

 const r=add();if(p<t.length)throw 0;return Math.round((r.pct?r.v/100:r.v)*1e10)/1e10}

function calcKey(k){

 else if(k==='='){if(!CALA)return;try{CALR=String(calcEval(CALA)).replace('.',',');CALD=true}catch(x){CALR='Error';CALD=true}}

 else{const op=/[+−×÷]/.test(k);if(CALD){CALD=false;if(op&&CALR!=='Error')CALA=CALR.replace(',','.');else CALA=''}

  CALA+=k}

document.head.insertAdjacentHTML('beforeend','<style>.evpl{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:50vh;overflow:auto}.evpi{text-align:left;border:1.5px solid #fecdd3;background:#fff1f2;color:#9f1239;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}.evpi:hover{background:#ffe4e6}.evpi small{font-size:13px;font-weight:500;opacity:.85}.box.evbad{outline:3px solid #e11d48;outline-offset:2px}.sst.dirty{color:#b45309}.sst.dirty::before{background:#f59e0b}.evlv{justify-content:flex-end;flex-wrap:wrap}</style>');
let SNAP='',SID7='',FLAG=false,ISNEW=false,LAST='';
const snapNow=()=>{try{return JSON.stringify(CUR)}catch(x){return ''}},
inEd=()=>!!(M&&ED&&CUR&&!PLAY&&document.getElementById('ql')),
dirty=()=>!!(FLAG&&CUR&&snapNow()!==SNAP),
lbl=()=>{const s=document.getElementById('sst');if(!s)return;
 if(dirty()){s.textContent='Cambios sin guardar';s.classList.remove('ok');s.classList.add('dirty')}
 else{s.classList.remove('dirty');s.textContent=LAST?'Guardado '+LAST:'Sin cambios por guardar';s.classList.toggle('ok',!!LAST)}};

/* qué le falta a cada pregunta para que el alumno pueda resolverla */
const MSG={hue:'escribe el texto y crea al menos un casillero de respuesta (botón «＋ Casillero de respuesta»)',par:'sube al menos una imagen y escribe el nombre de su casillero',cla:'agrega al menos un elemento dentro de una caja',lin:'escribe al menos una pareja completa (frase y su respuesta)',rim:'agrega al menos una pareja con sus dos imágenes',tab:'deja al menos una celda para que el alumno la responda',fac:'escribe al menos una cantidad que el alumno deba responder',cod:'agrega al menos un producto con su código',nom:'sube al menos una imagen (o texto) y escribe su nombre',cal:'escribe al menos una cantidad que el alumno deba calcular'};
function probQ(q,qi){
 const clean=v=>fs(String(v==null?'':v)).trim(),
  rows=(q.it||[]),
  partial=(arr,started,complete,label)=>{
   const S=arr.map((x,i)=>({x,i})).filter(o=>started(o.x));
   if(!S.length)return `agrega al menos ${label}`;
   const bad=S.filter(o=>!complete(o.x));
   return bad.length?`completa ${label} en ${bad.map(o=>o.i+1).join(', ')}`:'';
  };
 try{
  if(q.t==='hue'){
   /*
    * Los casilleros vacíos existen en el DOM como .pl input, pero ser()
    * los omite al sincronizar q.tx. Por eso la validación debe revisar
    * primero los controles que siguen visibles en el editor.
    */
   const live=[...document.querySelectorAll('#ql .rt[data-i]')]
     .filter(d=>String(d.dataset.i)===String(qi))
     .flatMap(d=>[...d.querySelectorAll('.pl input')]);
   if(live.length){
    const badLive=live.map((el,j)=>({j:j+1,v:String(el.value||'').trim()})).filter(x=>!x.v);
    return badLive.length?`completa la respuesta del casillero ${badLive.map(x=>x.j).join(', ')}`:'';
   }
   const L=q.m==='esc'?[{tx:q.tx||''}]:rws(q),slots=[];
   L.forEach((r,i)=>{for(const m of String(r.tx||'').matchAll(/\[([^\]]*)\]/g))slots.push({row:i+1,num:slots.length+1,a:m[1]})});
   if(!slots.length)return MSG.hue;
   const bad=slots.filter(x=>!x.a.split('|').some(y=>clean(y)));
   return bad.length?`completa la respuesta del casillero ${bad.map(x=>x.num).join(', ')}`:'';
  }
  if(q.t==='mc'){
   const op=(q.op||[]).map(clean),filled=op.filter(Boolean),correct=mcC(q).filter(j=>j>=0&&j<op.length&&op[j]);
   if(filled.length<2)return 'escribe al menos dos opciones';
   return correct.length?'':'marca cuál es la respuesta correcta';
  }
  if(q.t==='vf'){
   const S=rows.map((x,i)=>({x,i})).filter(o=>clean(o.x.tx)||o.x.v===true||o.x.v===false);
   if(!S.length)return 'escribe al menos una afirmación y marca Verdadero o Falso';
   const bad=S.filter(o=>!clean(o.x.tx)||(o.x.v!==true&&o.x.v!==false));
   return bad.length?`completa la afirmación y marca Verdadero o Falso en la fila ${bad.map(o=>o.i+1).join(', ')}`:'';
  }
  if(q.t==='ord')return rows.filter(x=>clean(x)).length>=2?'':'escribe al menos 2 pasos para ordenar';
  if(q.t==='par')return partial(rows,x=>!!(x.img||clean(x.tx)||clean(x.r)),x=>!!(x.img||clean(x.tx))&&!!clean(x.r),'una imagen o texto y su respuesta correcta');
  if(q.t==='nom')return partial(rows,x=>!!(x.img||clean(x.tx)||clean(x.r)),x=>!!(x.img||clean(x.tx))&&!!clean(x.r),'la imagen o texto y su nombre correcto');
  if(q.t==='lin')return partial(rows,x=>!!(clean(x.tx)||clean(x.r)),x=>!!clean(x.tx)&&!!clean(x.r),'ambos lados de cada pareja');
  if(q.t==='rim')return partial(rows,x=>!!(x.img||x.img2),x=>!!x.img&&!!x.img2,'las dos imágenes de cada pareja');
  if(q.t==='cla'){
   const C=q.cat||[],S=C.map((x,i)=>({x,i})).filter(o=>clean(o.x.n)||xs(o.x.it).length);
   if(S.length<2)return 'crea al menos dos cajas y coloca elementos dentro de ellas';
   const bad=S.filter(o=>!clean(o.x.n)||!xs(o.x.it).length);
   return bad.length?`completa el nombre y los elementos de la caja ${bad.map(o=>o.i+1).join(', ')}`:'';
  }
  if(q.t==='tab'){
   const g=tbG(q);let valid=0,bad=[];
   g.forEach((row,r)=>row.forEach((x,c)=>{
    if(tbH(q,r,c)||x.f===2)return;
    if(x.f===3){const op=(x.op||[]).map(clean).filter(Boolean),ci=Number.isInteger(+x.ci)?+x.ci:0;
     if(op.length||clean(x.tx)){if(op.length<2||!op[ci])bad.push(`${r+1},${c+1}`);else valid++}
    }else if(!x.f&&clean(x.tx))valid++;
   }));
   if(bad.length)return `revisa las opciones y la respuesta correcta de las celdas ${bad.join('; ')}`;
   return valid?'':'deja al menos una celda con respuesta correcta';
  }
  if(q.t==='fac'){
   const keys=['p','d','a','u','um','pk','mp','pl'];
   return partial(rows,x=>keys.some(k=>clean(x[k])),x=>!!clean(x.d)&&!!clean(x.a),'la descripción y la cantidad correcta de cada fila');
  }
  if(q.t==='cod')return partial(rows,x=>!!(clean(x.p)||clean(x.c)),x=>!!clean(x.p)&&!!clean(x.c),'el producto y su código en cada fila');
  if(q.t==='cal'){
   const L=(q.bl||[]).flatMap(b=>b.it||[]);
   return partial(L,x=>!!(clean(x.p)||clean(x.a)),x=>!!clean(x.p)&&!!clean(x.a),'el producto y la cantidad correcta de cada fila');
  }
  const T=document.createElement('template');T.innerHTML=pq(q);const R=T.content,
   slots=[...R.querySelectorAll('.gp[data-a],.hole[data-a],.nd[data-a]')],bad=slots.filter(el=>!String(el.getAttribute('data-a')||'').trim());
  if(bad.length)return 'completa todas las respuestas correctas de esta pregunta';
  return slots.length?'':'agrega al menos una respuesta correcta';
 }catch(x){console.error('probQ',x);return 'no se pudo comprobar esta pregunta; revisa que tenga todas sus respuestas correctas'}
}
function evProb(v){const o=[];(v.qs||[]).forEach((q,i)=>{const m=probQ(q,i);if(m)o.push({i,n:i+1,tipo:NM[q.t]||q.t,m})});return o}
const qBoxes=()=>[...document.querySelectorAll('#ql>.box')].slice(1);
function evIr(i){const b=qBoxes()[i];if(!b)return;try{COL.delete(CUR.qs[i])}catch(x){}b.classList.remove('cl');b.scrollIntoView({block:'center',behavior:'smooth'})}
function evAvisar(list){
 qBoxes().forEach((b,i)=>b.classList.toggle('evbad',list.some(p=>p.i===i)));
 const w=document.createElement('div');w.className='mdl';w.style.zIndex='250';
 w.setAttribute('role','alertdialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Respuestas pendientes');w.innerHTML='<div class="mbx evmodal"><div class="evm-head"><span class="evm-icon">!</span><div class="evm-title"><small>REVISIÓN NECESARIA</small><b>Faltan respuestas por completar</b></div></div><p>No se guardaron los cambios. Revisa los casilleros y las respuestas correctas que aparecen pendientes.</p><div class="evm-count">'+list.length+' pregunta'+(list.length===1?' pendiente':'s pendientes')+'</div><div class="evpl">'+list.map(p=>'<button type="button" class="evpi" data-i="'+p.i+'"><b>Pregunta '+p.n+' · '+e(p.tipo)+'</b><small>'+e(p.m.charAt(0).toUpperCase()+p.m.slice(1))+'</small></button>').join('')+'</div><div class="row" style="justify-content:flex-end"><button class="bt" data-x>Revisar ahora</button></div></div>';
 const end=()=>{document.removeEventListener('keydown',k,true);w.remove()},k=ev=>{if(ev.key==='Escape'){ev.stopPropagation();end()}};
 w.onclick=ev=>{const b=ev.target.closest('.evpi');if(b){end();evIr(+b.dataset.i)}else if(ev.target.closest('[data-x]')){end();evIr(list[0].i)}};
 document.addEventListener('keydown',k,true);document.body.appendChild(w);w.querySelector('[data-x]').focus()}

function marcar(){SNAP=snapNow();FLAG=false;ISNEW=false;LAST=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.querySelectorAll('#ql>.box.evbad').forEach(b=>b.classList.remove('evbad'));lbl()}
const errTxt=r=>{const m=r&&(r.e||r.error||r.msg||r.m||r.mensaje||r.message);let d='';try{d=r?JSON.stringify(r).slice(0,160):''}catch(x){}
 return m?String(m):'El servidor no aceptó los cambios.'+(d?' (Respuesta: '+d+')':'')+' Tus cambios siguen en pantalla; vuelve a intentar.'};
window.srvSave=async function(){
 const busy=r=>/candado|lock|tiempo de espera|timed? ?out|ocupad/i.test(errTxt(r));
 try{
  let r=await post('evalsGuardar',{db:DB});
  for(let n=1;n<=3&&r&&!r.ok&&busy(r);n++){await new Promise(z=>setTimeout(z,1500*n));r=await post('evalsGuardar',{db:DB})}
  if(r&&r.ok)return true;
  console.error('evalsGuardar',r);await dlg({t:'No se pudo guardar en el servidor',m:errTxt(r),nc:1,ok:'Entendido'});return false}
 catch(x){toast('Sin conexión: guardado solo en este equipo');return false}};
window.guardarEval=async function(){
 if(!M||!CUR){save(1);return true}
 const bad=evProb(CUR);if(bad.length){evAvisar(bad);return false}
 if(!API){save();marcar();return true}
 save();
 try{
  /* si el servidor está ocupado (candado/lock), reintenta solo en silencio */
  const busy=r=>/candado|lock|tiempo de espera|timed? ?out|ocupad/i.test(errTxt(r));
  let r=await post('evalsGuardar',{db:DB});
  for(let n=1;n<=3&&r&&!r.ok&&busy(r);n++){await new Promise(z=>setTimeout(z,1500*n));r=await post('evalsGuardar',{db:DB})}
  if(r&&r.ok){marcar();return true}
  console.error('evalsGuardar',r);await dlg({t:'No se pudo guardar en el servidor',m:errTxt(r),nc:1,ok:'Entendido'});return false}
 catch(x){await dlg({t:'Sin conexión',m:'No se pudo guardar. Tus cambios siguen en pantalla; revisa tu internet y vuelve a intentar.',nc:1,ok:'Entendido'});return false}};

/* guardado en segundo plano: no hace esperar al capacitador */
window.srvSaveBg=async function(nom){
 const busy=r=>/candado|lock|tiempo de espera|timed? ?out|ocupad/i.test(errTxt(r));
 try{
  let r=await post('evalsGuardar',{db:DB});
  for(let n=1;n<=3&&r&&!r.ok&&busy(r);n++){await new Promise(z=>setTimeout(z,1500*n));r=await post('evalsGuardar',{db:DB})}
  if(r&&r.ok){toast('Guardado ✔');return true}
  console.error('evalsGuardar',r);
  dlg({t:'No se pudo guardar «'+nom+'» en el servidor',m:errTxt(r)+' Abre el examen otra vez y pulsa Guardar.',nc:1,ok:'Entendido'});return false}
 catch(x){dlg({t:'Sin conexión',m:'«'+nom+'» quedó guardado solo en este equipo. Ábrelo otra vez y pulsa Guardar cuando tengas internet.',nc:1,ok:'Entendido'});return false}};
/* true = ya se puede salir (las validaciones se hacen al instante; el envío al servidor sigue solo) */
window.guardarRapido=function(){
 if(!M||!CUR){save(1);return true}
 const bad=evProb(CUR);if(bad.length){evAvisar(bad);return false}
 if(!API){save();marcar();return true}
 const nom=CUR.n||'el examen';
 save();marcar();toast('Guardando…');
 window.srvSaveBg(nom);
 return true};
function leaveDlg(){return new Promise(res=>{
 const w=document.createElement('div');w.className='mdl';
 w.innerHTML='<div class="mbx"><b>Tienes cambios sin guardar</b><p>Si sales ahora se perderán los cambios que hiciste en esta evaluación.</p><div class="row evlv"><button class="bt w" data-r="stay">Seguir editando</button><button class="bt dg" data-r="discard">Salir sin guardar</button><button class="bt" data-r="save">Guardar y salir</button></div></div>';
 const end=v=>{document.removeEventListener('keydown',k,true);w.remove();res(v)},k=ev=>{if(ev.key==='Escape'){ev.stopPropagation();end('stay')}};
 w.onclick=ev=>{const b=ev.target.closest('[data-r]');if(b)end(b.dataset.r)};
 document.addEventListener('keydown',k,true);document.body.appendChild(w);w.querySelector('[data-r="save"]').focus()})}
function descartar(){try{const k=DB.evals.findIndex(v=>v.id===CUR.id);if(k>=0){if(ISNEW)DB.evals.splice(k,1);else DB.evals[k]=JSON.parse(SNAP)}save()}catch(x){console.error(x)}}
/* true = se puede salir */
async function salida(){
 if(!inEd())return true;
 if(dirty()){const r=await leaveDlg();if(r==='stay')return false;if(r==='save'){if(!window.guardarRapido())return false}else descartar()}
 return true}

const bk7=back;back=async function(){
 if(PLAY&&M&&ED)return bk7.apply(this,arguments);
 if(inEd()){if(!await salida())return;CUR=null;PLAY=false;render();return}
 return bk7.apply(this,arguments)};
const sa7=salir;salir=async function(){
 if(inEd()){if(!await salida())return;CUR=null}
 return sa7.apply(this,arguments)};
const no7=open_;open_=function(){ISNEW=false;return no7.apply(this,arguments)};
const ne7=newE;newE=function(){ISNEW=true;return ne7.apply(this,arguments)};
const ed7=edit;edit=function(v){const r=ed7.apply(this,arguments);
 try{if(v&&SID7!==v.id){SID7=v.id;SNAP=snapNow();FLAG=false;LAST=''}else if(v&&!FLAG)SNAP=snapNow();lbl()}catch(x){console.error(x)}return r};
const rn7=render;render=function(){if(!CUR||!ED){SID7='';FLAG=false}return rn7.apply(this,arguments)};
const sv7=save;save=function(srv){const r=sv7.apply(this,arguments);try{if(!srv&&inEd()&&SID7===CUR.id){FLAG=true;lbl()}}catch(x){}return r};
addEventListener('beforeunload',ev=>{if(inEd()&&dirty()){ev.preventDefault();ev.returnValue='';return ''}});
}catch(x){console.error('v7',x)}})();

<script id="v42-editor-layout-polish">
(function(){
  let toolExtraHeight = 0;

  function ensureToolbar(){
    const app = document.getElementById('app');
    if(!app) return;
    const top = app.querySelector(':scope > .tbtop.tbbtns');
    const actions = app.querySelector('#edbar');
    const editor = app.querySelector(':scope > .ed');
    if(!top || !actions || !editor) return;

    let row = app.querySelector(':scope > .editor-topline');
    if(!row){
      row = document.createElement('div');
      row.className = 'editor-topline';
      app.insertBefore(row, top);
    }
    if(top.parentNode !== row) row.appendChild(top);
    if(actions.parentNode !== row) row.appendChild(actions);

    const template = top.querySelector('.tbb');
    if(template){
      template.textContent = 'Elegir plantilla prediseñada';
      template.setAttribute('aria-label','Elegir plantilla prediseñada');
      template.title = 'Elegir plantilla prediseñada';
    }
    const preview = [...actions.querySelectorAll('button')].find(b => /Probar|PLAY\s*=\s*true/i.test((b.textContent||'')+' '+(b.getAttribute('onclick')||'')));
    if(preview){ preview.textContent = '▶ Vista previa'; preview.title = 'Vista previa del examen'; }
    const save = actions.querySelector('#edSaveBtn') || [...actions.querySelectorAll('button')].find(b => /guardarEval/.test(b.getAttribute('onclick')||''));
    if(save){ save.textContent = 'Guardar los cambios'; save.title = 'Guardar los cambios'; save.disabled = false; }
    const finish = actions.querySelector('#edfin') || actions.querySelector('.bt.fin');
    if(finish){ finish.textContent = 'Finalizar'; finish.title = 'Finalizar edición'; }
  }

  function ensureToolExpand(){
    const side = document.querySelector('#app>.ed>.side');
    const tl = side && side.querySelector('#tl');
    if(!side || !tl) return;
    if(!side.querySelector('.tool-expand')){
      const controls = document.createElement('div');
      controls.className = 'tool-expand';
      controls.innerHTML = '<button type="button" class="tool-expand-btn" onclick="tbToolsResize(1)" title="Ampliar la caja de herramientas hacia abajo" aria-label="Ampliar la caja de herramientas hacia abajo">⌄</button><button type="button" class="tool-expand-btn" onclick="tbToolsResize(-1)" title="Reducir la altura de la caja de herramientas" aria-label="Reducir la altura de la caja de herramientas">⌃</button>';
      tl.insertAdjacentElement('afterend', controls);
    }
    updateToolExpand();
  }

  function updateToolExpand(){
    const side = document.querySelector('#app>.ed>.side');
    if(!side) return;
    if(window.innerWidth < 980){
      side.style.height = '';
      side.style.maxHeight = '';
      return;
    }
    const base = Math.max(320, window.innerHeight - 190);
    const max = Math.max(320, window.innerHeight - 74);
    const extra = Math.max(0, Math.min(toolExtraHeight, max - base));
    toolExtraHeight = extra;
    side.style.height = Math.min(max, base + extra) + 'px';
    side.style.maxHeight = max + 'px';
    const controls = side.querySelector('.tool-expand');
    if(controls){
      const [down,up] = controls.querySelectorAll('button');
      if(down) down.disabled = base + extra >= max - 1;
      if(up) up.disabled = extra <= 0;
    }
  }
  window.tbToolsResize = function(direction){
    toolExtraHeight = Math.max(0, toolExtraHeight + (direction > 0 ? 72 : -72));
    updateToolExpand();
  };

  function syncEvaluationDesign(){
    try{
      const color = (typeof CUR !== 'undefined' && CUR && typeof hdEff === 'function' && typeof hx === 'function')
        ? (hx(hdEff(CUR).dc.col) || '#16335f') : '#16335f';
      const ql = document.getElementById('ql');
      const header = document.getElementById('hdE');
      const app = document.getElementById('app');
      [ql,header,app].forEach(el => { if(el) el.style.setProperty('--eval-accent', color); });
      if(typeof hqUp === 'function') hqUp();
      if(header){
        header.style.background = '#fff';
        header.style.borderColor = color;
      }
      if(ql) ql.style.background = '#fff';
    }catch(err){ console.error('v42 evaluation style',err); }
  }

  /* La función de estilos del examen vuelve a ejecutarse cuando cambia su color principal.
     Se añaden al final las reglas que mantienen la hoja blanca y los bordes temáticos. */
  if(typeof hqUp === 'function'){
    const hqUpPrevious = hqUp;
    hqUp = function(){
      const result = hqUpPrevious.apply(this, arguments);
      try{
        const color = (typeof CUR !== 'undefined' && CUR && typeof hdEff === 'function' && typeof hx === 'function')
          ? (hx(hdEff(CUR).dc.col) || '#16335f') : '#16335f';
        const st = document.getElementById('hqs');
        if(st){
          st.textContent += `\n/* v42: papel blanco y contornos con el color principal de esta evaluación */\n
            #ql,.ed #ql,.hqp{background:#fff!important;}
            .box.q,#ql>.box:not(.tb):not(.tbph){
              background:#fff!important;
              border:1.5px solid ${color}!important;
              border-radius:14px!important;
              box-shadow:0 1px 3px rgba(19,48,42,.07)!important;
            }
            #hdE{background:#fff!important;border:2px solid ${color}!important;}
            #hdE .eh{background:#fff!important;}
            #hdE .eh:not(.plain){border-color:${color}!important;}
            #hdE .hdtools{border-bottom-color:${color}55!important;}
          `;
        }
        const ql = document.getElementById('ql');
        const header = document.getElementById('hdE');
        const app = document.getElementById('app');
        [ql,header,app].forEach(el => { if(el) el.style.setProperty('--eval-accent', color); });
      }catch(err){ console.error('v42 hqUp',err); }
      return result;
    };
  }

  /* Elige la plantilla desde el botón renombrado y conserva la misma galería. */
  if(typeof window.tbOpenTpl === 'function'){
    window.tbOpenTpl = function(){
      try{hdClose()}catch(err){}
      const modal = tbModal('Elegir plantilla prediseñada', body => {
        body.innerHTML = '<div id="tbtpl"></div>';
        body.firstChild.innerHTML = tbTplHtml();
      });
      modal.querySelector('.mbx').classList.add('tpm');
      tbTplFit();
    };
  }

  /* Elimina los antiguos listeners que devolvían Guardar dentro de la tarjeta del nombre. */
  try{ if(typeof window.tbPlace === 'function') removeEventListener('resize', window.tbPlace); }catch(err){}
  try{ if(typeof window.barPlace === 'function') removeEventListener('resize', window.barPlace); }catch(err){}

  const editPrevious = edit;
  edit = function(){
    const result = editPrevious.apply(this, arguments);
    try{
      ensureToolbar();
      ensureToolExpand();
      syncEvaluationDesign();
      updateToolExpand();
    }catch(err){ console.error('v42 editor layout',err); }
    return result;
  };

  /* Reacomoda la fila cuando cambia el ancho; no separa otra vez la barra de acciones. */
  window.tbPlace = ensureToolbar;
  window.barPlace = ensureToolbar;
  addEventListener('resize', function(){ ensureToolbar(); updateToolExpand(); });

  /* También al entrar por primera vez a edición si el HTML se renderiza después de este script. */
  if(document.querySelector('#app>.ed')){
    ensureToolbar(); ensureToolExpand(); syncEvaluationDesign();
  }
})();
</script>
